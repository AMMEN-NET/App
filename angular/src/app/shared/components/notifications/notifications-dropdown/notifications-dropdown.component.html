<div class="relative" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
  
  <button (click)="toggleDropdown()" class="relative p-1 text-slate-600 hover:text-slate-900 transition-colors focus:outline-none mt-1">
    <i class="fa fa-bell fa-lg"></i>
    <div *ngIf="unreadCount > 0" class="absolute top-0 right-0 -mt-0.5 -mr-0.5">
      <span class="flex h-3 w-3 relative">
        <span class="relative inline-flex rounded-full h-2 w-2 bg-red-400"></span>
      </span>
    </div>
  </button>

  <div *ngIf="isOpen" (click)="isOpen = false" class="fixed inset-0 z-40 cursor-default md:hidden"></div>

  <div *ngIf="isOpen" class="absolute right-0 mt-1 w-80 bg-[#FFFBF0] rounded-lg shadow-xl py-2 z-50 ring-1 ring-black ring-opacity-5 origin-top-right overflow-hidden animate-fade-in-up">
    
    <div class="px-4 py-2 border-b border-gray-200/50 flex justify-between items-center bg-[#FFFBF0]">
      <h5 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Notificaciones</h5>
      <button *ngIf="unreadCount > 0" (click)="marcarTodas()" class="text-xs text-blue-600 hover:text-blue-800 font-medium transition-colors">
        Marcar leídas
      </button>
    </div>

    <div class="max-h-80 overflow-y-auto custom-scrollbar">

      <!-- Banner informativo de frecuencia semanal -->
      <div *ngIf="esFrecuenciaSemanal" class="mx-3 mt-3 mb-2 p-3 bg-blue-50 border-l-4 border-blue-500 rounded-r-lg shadow-sm">
        <div class="flex items-start gap-3">
          <div class="flex-shrink-0 w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center mt-0.5">
            <i class="fa fa-calendar-week text-blue-600 text-sm"></i>
          </div>
          <div class="flex-1">
            <h6 class="text-sm font-bold text-blue-900 leading-tight mb-1">
              Frecuencia semanal activa
            </h6>
            <p class="text-xs text-blue-700 leading-relaxed mb-2">
              Recibirás un resumen con todas tus notificaciones cada <strong>domingo a las 20:00 hs</strong>.
            </p>
            <div class="flex items-center gap-1.5 text-[11px] text-blue-600">
              <i class="fa fa-info-circle"></i>
              <span>Para cambiar esta configuración, ingresá a tu perfil</span>
            </div>
          </div>
        </div>
      </div>
      
      <div *ngFor="let notif of notificaciones" 
          (click)="clickNotificacion(notif)" 
          class="px-4 py-3 border-b border-gray-100 hover:bg-orange-50/50 cursor-pointer transition-colors relative group">
        <div *ngIf="!notif.leida" class="absolute left-0 top-0 bottom-0 w-1 bg-blue-600"></div>

        <div class="flex items-start gap-3">
            <div class="mt-1 text-gray-500 group-hover:text-gray-700">
                <i class="fa {{ notif.icono || 'fa-info-circle' }}"></i>
            </div>
            <div class="flex-1">
                <p class="text-sm font-bold text-gray-800 leading-snug">{{ notif.titulo }}</p>
                <p class="text-xs text-gray-600 mt-1 leading-relaxed">{{ notif.mensaje }}</p>
                <p class="text-[10px] text-gray-400 text-right mt-2">{{ notif.fecha | date:'short' }}</p>
            </div>
        </div>
      </div>

      <div *ngIf="notificaciones.length === 0" class="px-4 py-8 text-center">
        <i class="fa fa-bell-slash text-gray-300 text-2xl mb-2 block"></i>
        <span class="text-gray-400 text-xs">Sin novedades por aquí</span>
      </div>
    </div>
  </div>
</div>
