<div class="flex flex-col gap-6">
  
  <div class="flex flex-col items-center justify-center pb-4 border-b border-gray-100">
    <div class="relative group">
      <div class="w-28 h-28 rounded-full overflow-hidden border-4 border-gray-200 bg-gray-50 shadow-sm">
        @if (urlImagen) {
            <img [src]="urlImagen" class="w-full h-full object-cover" (error)="cargarImagenPorDefecto()">
        } @else {
            <div class="w-full h-full flex items-center justify-center text-gray-400">
                <i class="fa fa-user fa-3x"></i> </div>
        }
      </div>
      <label class="absolute bottom-0 right-0 bg-blue-600 hover:bg-blue-700 text-white w-8 h-8 rounded-full flex items-center justify-center cursor-pointer shadow transition-all">
        <i class="fa fa-camera text-sm"></i>
        <input type="file" class="hidden" (change)="alSeleccionarArchivo($event)" accept="image/*">
      </label>
    </div>
    <span class="text-xs text-gray-400 mt-2">Haz click en la cámara para cambiar</span>
  </div>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-col gap-4">
    
    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de usuario</label>
      <input type="text" formControlName="userName" class="w-full p-2 border border-gray-300 rounded bg-gray-100 cursor-not-allowed opacity-70">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="form-group">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input type="text" formControlName="name" class="w-full p-2 border border-gray-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
      </div>
  
      <div class="form-group">
        <label class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
        <input type="text" formControlName="surname" class="w-full p-2 border border-gray-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
      </div>
    </div>

    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
      <input type="email" formControlName="email" class="w-full p-2 border border-gray-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
    </div>

    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
      <input type="text" formControlName="phoneNumber" class="w-full p-2 border border-gray-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
    </div>

    <div class="pt-4">
      <button type="submit" 
        [disabled]="(form.pristine && !archivoSeleccionado) || form.invalid || estaCargando()"
        class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex justify-center items-center gap-2">
  @if (estaCargando()) {
      <i class="fa fa-spinner fa-spin"></i> Guardando...
  } @else {
      Guardar Cambios
  }
</button>
    </div>

  </form>
</div>
