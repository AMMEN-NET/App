<div class="flex flex-col gap-6">
  
  <div class="flex flex-col items-center justify-center pb-4 border-b border-gray-100">
    <div class="relative group">
      <div class="w-28 h-28 rounded-full overflow-hidden border-4 border-gray-200 bg-gray-50 shadow-sm">
        @if (urlImagen) {
            <img [src]="urlImagen" class="w-full h-full object-cover" (error)="cargarImagenPorDefecto()">
        } @else {
            <div class="w-full h-full flex items-center justify-center text-gray-400">
                <i class="fa fa-user fa-3x"></i>
            </div>
        }
      </div>

      <label class="absolute bottom-0 right-0 bg-blue-600 hover:bg-blue-700 text-white w-8 h-8 rounded-full flex items-center justify-center cursor-pointer shadow-lg transition-all z-10">
        <i class="fa fa-camera text-base pt-1 pl-2"></i>
        <input type="file" class="hidden" (change)="alSeleccionarArchivo($event)" accept="image/*">
      </label>
      
    </div>
    <span class="text-xs text-gray-400 mt-2">Hace click en la cámara para cambiar tu foto</span>
  </div>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-col gap-4">
    
    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de usuario</label>
      <input type="text" formControlName="userName" class="w-full p-2 border border-gray-300 rounded bg-gray-100 cursor-not-allowed opacity-70">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="form-group">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input type="text" formControlName="name" class="w-full p-2 border border-gray-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
      </div>
  
      <div class="form-group">
        <label class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
        <input type="text" formControlName="surname" class="w-full p-2 border border-gray-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
      </div>
    </div>

    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
      <input type="email" formControlName="email" class="w-full p-2 border border-gray-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
    </div>

    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
      <input type="text" formControlName="phoneNumber" class="w-full p-2 border border-gray-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
    </div>

    <div class="mt-4 pt-4 border-t border-gray-100">
        <h3 class="text-base font-semibold text-gray-800 mb-3">Preferencias de Notificación</h3>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div class="flex items-center justify-between p-3 border border-gray-200 rounded bg-gray-50">
                <span class="text-sm font-medium text-gray-700"> <i class="fa fa-bell text-blue-500 mr-2"></i> Pantalla</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" formControlName="notifyScreen" class="sr-only peer">
                    <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>
            <div class="flex items-center justify-between p-3 border border-gray-200 rounded bg-gray-50">
                <span class="text-sm font-medium text-gray-700"> <i class="fa fa-envelope text-yellow-500 mr-2"></i> Email</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" formControlName="notifyEmail" class="sr-only peer">
                    <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="block text-sm font-medium text-gray-700 mb-2">Frecuencia de envío</label>
            <div class="flex gap-4">
                <label class="flex items-center cursor-pointer">
                    <input type="radio" formControlName="notifyFrequency" value="immediate" class="text-blue-600 focus:ring-blue-500 border-gray-300">
                    <span class="ml-2 text-sm text-gray-700">Inmediata</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" formControlName="notifyFrequency" value="weekly" class="text-blue-600 focus:ring-blue-500 border-gray-300">
                    <span class="ml-2 text-sm text-gray-700">Semanal</span>
                </label>
            </div>
        </div>
    </div>

    <div class="pt-4">
      <button type="submit" 
        [disabled]="(form.pristine && !archivoSeleccionado) || form.invalid || estaCargando()"
        class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex justify-center items-center gap-2">
          @if (estaCargando()) {
              <i class="fa fa-spinner fa-spin"></i> Guardando...
          } @else {
              Guardar Cambios
          }
        </button>
    </div>

  </form>

  <div class="mt-12 pt-8 border-t-2 border-red-100">
      <h3 class="text-lg font-bold text-red-600 mb-2">Zona de Peligro</h3>
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 bg-red-50 p-4 rounded-xl border border-red-200">
          <div>
              <p class="text-gray-700 font-medium">Eliminar cuenta permanentemente</p>
              <p class="text-sm text-gray-500 mt-1">
                  Una vez que elimines tu cuenta, tus opiniones dejarán de ser visibles para la comunidad.
              </p>
          </div>
          
          <button type="button" 
                  (click)="eliminarCuenta()"
                  class="whitespace-nowrap px-5 py-2.5 bg-white border border-red-300 text-red-600 font-semibold rounded-lg hover:bg-red-600 hover:text-white transition-all shadow-sm flex items-center gap-2">
              <i class="fa fa-trash-alt"></i> Eliminar mi cuenta
          </button>
      </div>
  </div>

</div>
